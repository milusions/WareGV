# ==============================================================================
# ROBOT LOCALIZATION EXTENDED KALMAN FILTER (EKF) CONFIGURATION FILE
# ==============================================================================

ekf_filter_node:
  ros__parameters:
    # --------------------------------------------------------------------------
    # 1. CORE OPERATIONAL SETTINGS
    # Governs state estimation frequency, dimensions, and transform output.
    # --------------------------------------------------------------------------
    frequency: 30.0                   # State estimation calculation and output publication rate in Hz (30 Hz = ~33ms step)
    two_d_mode: true                  # 2D Planar Mode: forces Z, Roll, Pitch, Z-vel, Roll-vel, Pitch-vel, Z-acc, Roll-acc, and Pitch-acc to 0.0
    publish_tf: true                  # Publish estimated coordinate frame transform (world_frame -> base_link_frame) to TF tree

    # --------------------------------------------------------------------------
    # 2. COORDINATE FRAME DEFINITIONS
    # Standard REP-105 coordinate frames.
    # --------------------------------------------------------------------------
    map_frame: map                    # Global map reference frame ID
    odom_frame: odom                  # Continuous local odometry reference frame ID
    base_link_frame: base_footprint   # Robot base root frame ID
    world_frame: odom                 # Reference frame for state output: "odom" (local continuous) or "map" (global map fused)

    # --------------------------------------------------------------------------
    # 3. SENSOR INPUT 1: WHEEL ODOMETRY (/odom/wheel)
    # Fuses position, velocity, and orientation from wheel encoders.
    # --------------------------------------------------------------------------
    odom0: /odom/wheel
    
    # Selection Matrix [15 States]:
    # Configured to fuse X & Y position, Yaw orientation, X & Y linear velocities, and Yaw angular velocity.
    odom0_config: [true,  true,  false,   # [X,  Y,  Z]  Position states (Z disabled for 2D mode)
                   false, false, true,    # [r,  p,  y]  Orientation states (Roll & Pitch disabled; Yaw enabled)
                   true,  true,  false,   # [vx, vy, vz] Linear velocity states (vx & vy enabled for differential/omni drive)
                   false, false, true,    # [vr, vp, vy] Angular velocity states (Yaw velocity enabled)
                   false, false, false]   # [ax, ay, az] Linear acceleration states

    # --------------------------------------------------------------------------
    # 4. SENSOR INPUT 2: INERTIAL MEASUREMENT UNIT (/imu/chasis)
    # Fuses orientation, angular velocity, and linear acceleration from IMU.
    # --------------------------------------------------------------------------
    imu0: /imu/chasis
    
    # Selection Matrix [15 States]:
    # Configured to fuse absolute 3D orientation (r, p, y), 3D angular velocities (vr, vp, vy), and 2D linear accelerations (ax, ay).
    imu0_config:  [false, false, false,   # [X,  Y,  Z]  Position states
                   true,  true,  true,    # [r,  p,  y]  Orientation states (Absolute Roll, Pitch, and Yaw orientation fused)
                   false, false, false,   # [vx, vy, vz] Linear velocity states
                   true,  true,  true,    # [vr, vp, vy] Angular velocity states (Roll, Pitch, and Yaw rotational velocities fused)
                   true,  true,  false]   # [ax, ay, az] Linear acceleration states (X & Y accelerations fused)