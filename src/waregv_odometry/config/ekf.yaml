ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    predict_to_current_time: true
    transform_timeout: 0.1

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom          # EKF publishes odom -> base_footprint (SLAM owns map -> odom)

    # Config order: x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az

    # Wheel inverse-kinematics twist: forward speed + yaw rate
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    # Gyro: yaw rate only (no absolute yaw, so no wrap problem exists)
    imu0: /imu/filtered
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
    imu0_twist_rejection_threshold: 6.0