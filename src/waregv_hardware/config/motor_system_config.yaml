# waregv_hardware / config / motor_system_config.yaml
#
# NOTE: max_velocity/min_velocity below are in rad/s (wheel angular
# velocity), matching everything else in this file and in motor_system.py.
# "3.0" is a PLACEHOLDER for the "30" you gave verbally, which was in a
# different unit (m/s) and larger than the previous 9.0 rad/s cap even
# though you asked to slow the robot down -- confirm the real number before
# running this on hardware.

motor_limits:
  max_velocity: 3.0           # rad/s -- PLACEHOLDER, confirm this value/unit before use
  min_velocity: -3.0
  max_angular_velocity: 9.0   # rad/s, kept separate in case you clip angular commands differently upstream
  min_angular_velocity: -9.0
  # max_acceleration / max_jerk are no longer used for the velocity ramp
  # (replaced by bezier_profile.duration below) but are left here in case
  # you want to reintroduce a hard-limited fallback later.
  max_acceleration: 200.0
  min_acceleration: -200.0
  max_jerk: 2000.0
  min_jerk: -2000.0

bezier_profile:
  duration: 0.25   # seconds for a full ramp from any velocity to a new target.
                    # Lower = snappier/more responsive. Higher = smoother/more sluggish.
                    # Try 0.15-0.2 if this still feels slow; try 0.35-0.5 if it feels twitchy.

filter:
  moving_average_window: 1   # no averaging -- profile output passed straight through
  update_rate_hz: 200.0      # control loop step rate; higher = less per-tick lag

brake_compensation:
  enabled: true              # PX4-style momentum cancellation on sudden target changes
  trigger_rate_threshold: 15.0   # rad/s^2 -- how fast the *commanded target* must change to count as "sudden"
  min_velocity_to_trigger: 1.0   # rad/s -- don't bother braking if we were barely moving
  gain: 0.2                      # fraction of pre-change velocity used as reverse counter-pulse
  duration: 0.08                 # seconds the pulse lasts -- kept short so it doesn't add lag